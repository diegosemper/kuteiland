<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0612">
  <meta name="description" content="Een zwevend eiland boven het niets. Hak. Bouw. Overleef.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kuteiland">
  <title>Kuteiland</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" as="image" href="icons/logo.webp">
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0612;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }
    #rotate {
      display: none;
      position: fixed; inset: 0; z-index: 10;
      align-items: center; justify-content: center; text-align: center;
      background: #0b0612; color: #d9cdea;
      font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace;
      padding: 24px;
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #rotate { display: flex; }
    }

    /* ---------- opstartscherm ---------- */
    #splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 38%, #3a2470 0%, #1a0f33 45%, #0b0612 100%);
      color: #ece3f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .5s ease;
      overflow: hidden;
    }
    #splash.weg { opacity: 0; pointer-events: none; }
    #splash .ster {
      position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
      animation: twinkel 2.4s ease-in-out infinite;
    }
    @keyframes twinkel { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    #splash .gloed {
      position: absolute; width: 90vmin; height: 90vmin; border-radius: 50%;
      background: radial-gradient(circle, rgba(155,107,255,.35) 0%, rgba(155,107,255,0) 65%);
      top: 50%; left: 50%; transform: translate(-50%, -62%);
      animation: puls 3s ease-in-out infinite;
    }
    @keyframes puls { 0%, 100% { transform: translate(-50%, -62%) scale(.92); } 50% { transform: translate(-50%, -62%) scale(1.06); } }
    #splash img {
      position: relative; width: min(82vw, 52vh, 440px); height: auto;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));
      animation: binnen .9s cubic-bezier(.2,1.6,.4,1) both, zweef 4s ease-in-out .9s infinite;
    }
    @keyframes binnen { from { transform: scale(.2) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes zweef { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
    #splash .onder { position: relative; margin-top: 4vh; width: min(70vw, 320px); text-align: center; min-height: 92px; }
    #splash .balk { height: 10px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; border: 1px solid rgba(184,166,217,.35); }
    #splash .vul { height: 100%; width: 0; background: linear-gradient(90deg, #ffd98a, #ff9ad0, #9b6bff); transition: width .4s ease; }
    #splash .tekst { margin-top: 12px; font: italic 15px/1.4 Georgia, "Times New Roman", serif; color: #d9c2ff; min-height: 21px; }
    #splash button {
      display: none; margin: 0 auto; padding: 16px 34px; border-radius: 16px;
      border: 2px solid #ffd98a; background: linear-gradient(180deg, #ffcf5a, #ff9a3a);
      color: #3a1a00; font: 900 18px/1 system-ui, sans-serif; letter-spacing: 1px;
      box-shadow: 0 6px 0 #b8541a, 0 12px 24px rgba(0,0,0,.4);
      animation: hup 1.1s ease-in-out infinite;
    }
    #splash button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8541a; }
    @keyframes hup { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    #splash.klaar .balk, #splash.klaar .tekst { display: none; }
    #splash.klaar button { display: block; }
    #splash .versie { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; color: #6a5f80; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="splash">
    <div class="gloed"></div>
    <img src="icons/logo.webp" alt="Kuteiland">
    <div class="onder">
      <div class="balk"><div class="vul"></div></div>
      <div class="tekst">Het eiland wordt wakker...</div>
      <button>TIK OM TE SPELEN</button>
    </div>
    <div class="versie">Kuteiland</div>
  </div>
  <script>
    // Opstartscherm: sterren, laadteksten en een balk; het spel wacht tot je op de knop tikt.
    (function () {
      var s = document.getElementById('splash');
      // ?nosplash: meteen spelen (voor testen)
      if (/[?&]nosplash/.test(location.search)) { s.remove(); return; }
      window.kuteilandSplash = true;
      for (var i = 0; i < 60; i++) {
        var st = document.createElement('div');
        st.className = 'ster';
        st.style.left = Math.random() * 100 + '%';
        st.style.top = Math.random() * 100 + '%';
        st.style.animationDelay = (Math.random() * 2.4) + 's';
        var size = 1 + Math.random() * 2.5;
        st.style.width = st.style.height = size + 'px';
        s.appendChild(st);
      }
      var lines = ['Het eiland wordt wakker...', 'Bomen uit bed trekken...', 'Puin op kleur sorteren...', 'De Stem schraapt haar keel...',
        'Wezens in de rij zetten...', 'Roest opwrijven...', 'Zwaartekracht controleren... bijna goed', 'Het beest voeren...'];
      var tekst = s.querySelector('.tekst'), vul = s.querySelector('.vul'), knop = s.querySelector('button');
      var pct = 0, n = 0, klaar = false, start = Date.now();
      var tik = setInterval(function () {
        pct = Math.min(klaar ? 100 : 90, pct + (klaar ? 25 : 4 + Math.random() * 8));
        vul.style.width = pct + '%';
        if (++n % 4 === 0) tekst.textContent = lines[Math.floor(Math.random() * lines.length)];
        if (klaar && pct >= 100 && Date.now() - start > 1600) { clearInterval(tik); s.classList.add('klaar'); }
      }, 180);
      window.addEventListener('kuteiland-ready', function () { klaar = true; });
      knop.addEventListener('click', function () {
        s.classList.add('weg');
        window.kuteilandSplash = false;
        window.dispatchEvent(new Event('kuteiland-start'));
        setTimeout(function () { s.remove(); }, 600);
      });
    })();
  </script>
  <div id="rotate">Draai je telefoon rechtop.<br>Het eiland is al scheef genoeg.</div>
  <noscript>Zonder JavaScript is er geen eiland. Alleen leegte.</noscript>
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
